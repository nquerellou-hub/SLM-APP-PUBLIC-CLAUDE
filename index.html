  <script>
    let deferredInstallPrompt=null;
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;window.dispatchEvent(new Event('slm-install-ready'))});
    window.slmInstall=async()=>{if(!deferredInstallPrompt){const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);typeof toast==='function'&&toast(ios?'Sur iPhone : touchez Partager puis « Sur l’écran d’accueil ».':'Ouvrez le menu ⋮ du navigateur puis « Installer l’application ».');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null};
  </script>
